# Torana Security Scan — scan a repository and report findings to Torana.
#
# Spec: pantheon-integration/docs/CI_SCAN_GATE_AND_INGEST.md
#
# ⭐ NO SECRET. The job proves which repository it is running in with a GitHub-issued
# OIDC assertion (`permissions: id-token: write`), and exchanges that for a 15-minute
# Torana token bound to this repository. Nothing is stored in your repo. Install the
# Torana GitHub App for your organisation once; every repo then works with no setup.
#
# ⛔ `actions/` IS AT THIS REPO'S ROOT ON PURPOSE. `build_customer_plugin.py` rmtree's
# `plugins/<plugin>/{skills,hooks,wheels}` on every run, so an action authored inside the
# generated `plugins/` tree would be deleted by the next `make customer-plugin` — and only
# noticed when a customer's `uses:` started 404ing.
#
# Quickstart (commit as .github/workflows/torana-scan.yml):
#
#   on:
#     pull_request:                            # gate — diff scan
#     push:     { branches: [main] }           # inventory + closure — REQUIRED
#     schedule: [{ cron: '17 6 * * *' }]       # re-check what is already shipped
#     workflow_dispatch:
#   jobs:
#     scan:
#       permissions: { id-token: write, contents: read }
#       steps:
#         - uses: actions/checkout@v4
#           with: { fetch-depth: 0 }
#         - uses: Torana-Inc/torana-skills/actions/scan@v1
#
# ⛔ Ship BOTH `pull_request` and `push`. A pull_request-only install gates correctly
# forever and never records a finding — inventory and closure hang off the default-branch
# run. ⚠️ Use a NON-ROUND cron minute: ':00' in every repo fires an org at once.

name: "Torana Security Scan"
description: "Scan a repository for vulnerabilities (SAST/SCA/IaC/secrets) and report to Torana — no stored credential."
author: "Torana"

inputs:
  torana-url:
    description: "Your Torana platform base URL, e.g. https://app.toranasecurity.ai"
    required: true
  scan-types:
    description: "Comma-separated: SAST,SCA,Secret,IaC,Container — or 'all'."
    required: false
    default: "all"
  scope:
    description: >-
      'auto' (default) derives it from the event: a pull_request scans the DIFF
      (scan_scope=changed), anything else scans the FULL tree (scan_scope=full).
      Force with 'full' or 'changed'. ⛔ Only a full scan may close findings.
    required: false
    default: "auto"
  push:
    description: "Send results to Torana. 'false' scans and prints only."
    required: false
    default: "true"
  audience:
    description: "OIDC audience to request. Must match the platform's expected audience."
    required: false
    default: "torana"
  upload-github-sarif:
    description: "Also upload the SARIF to GitHub's Security tab."
    required: false
    default: "false"
  reachability:
    description: >-
      Answer this repository's code-reachability queue after reporting: for each
      open finding Torana cannot judge on its own, read the checkout and record
      whether this repository's code actually imports the package / reaches the
      function. An absence LOWERS the finding's priority; it never closes it and
      never raises one. ⛔ Never runs on a pull_request: a PR's findings land in
      branch state, so there is no queue to answer. 'false' skips it.
    required: false
    default: "true"

outputs:
  sarif-path:
    description: "Path to the merged SARIF document."
    value: ${{ steps.scan.outputs.sarif }}
  scan-scope:
    description: "What this run actually covered: full | changed."
    value: ${{ steps.mode.outputs.scope }}
  base-scanned:
    description: >-
      'true' when the base tree was also scanned, which is what lets Torana gate on
      NEW findings. Empty on a push/schedule, or on a PR with no reachable base.
    value: ${{ steps.scan.outputs.base-scanned }}

runs:
  using: "composite"
  steps:
    - name: Resolve mode
      id: mode
      shell: bash
      run: |
        set -euo pipefail
        # ⛔ scan_scope is DECLARED by the runner, never inferred server-side. A scheduled
        # run may legitimately scan a subset, and a diff SARIF is structurally identical to
        # a full one — only the runner knows what it examined.
        case "${{ inputs.scope }}" in
          full|changed) SCOPE="${{ inputs.scope }}" ;;
          auto)
            if [ "${{ github.event_name }}" = "pull_request" ]; then SCOPE=changed; else SCOPE=full; fi ;;
          *) echo "::error::scope must be auto|full|changed"; exit 1 ;;
        esac
        echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
        echo "Torana scan mode: event=${{ github.event_name }} scan_scope=$SCOPE"

    - name: Engine cache key
      id: engines-key
      shell: bash
      run: |
        set -euo pipefail
        # ⛔ hashFiles() only sees files under GITHUB_WORKSPACE, and this action's scan_pack.json lives in the
        # action's own checkout, so `hashFiles('**/scan_pack.json')` hashed nothing and the key never moved on a
        # pin bump. The key is computed here instead: the PIN FILE and the installer (a version bump or an
        # install change invalidates by construction), plus OS, arch, runner image and python (the pack's venv/
        # is bound to the interpreter it was built with).
        REF="${{ github.action_path }}/../../plugins/torana/skills/torana-scan/references"
        PIN=$(cat "$REF/scan_pack.json" "$REF/install_engines.sh" | python3 -c 'import hashlib,sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest()[:16])')
        PY=$(python3 -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')
        echo "key=torana-scan-engines-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-na}-${ImageVersion:-na}-py${PY}-${PIN}" >> "$GITHUB_OUTPUT"
        # One directory, named once: install_engines.sh and scan_pack.py both read TORANA_SCAN_PACK_DIR.
        echo "TORANA_SCAN_PACK_DIR=$HOME/.torana/scan-pack" >> "$GITHUB_ENV"

    - name: Restore pinned engines
      id: engines-cache
      uses: actions/cache/restore@v4
      with:
        # ⛔ THE INSTALL DIR, not the action's references/: install_engines.sh writes bin/, venv/ and rules/ to
        # $TORANA_SCAN_PACK_DIR (default ~/.torana/scan-pack, install_engines.sh:37, scan_pack.py:48). The old path
        # (references/scan_pack/) is never written, so the cache never held an engine.
        path: ~/.torana/scan-pack
        key: ${{ steps.engines-key.outputs.key }}

    - name: Install engines + the Torana CLI
      id: engines-install
      shell: bash
      env:
        ENGINES_CACHED: ${{ steps.engines-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        REF="${{ github.action_path }}/../../plugins/torana/skills/torana-scan/references"
        WHEELS="${{ github.action_path }}/../../plugins/torana/skills/torana-skill/wheels"
        echo "TORANA_SCAN_REF=$REF" >> "$GITHUB_ENV"
        # ⚠️ install_engines.sh re-downloads unconditionally, so a hit is worth something only if it is skipped.
        # An exact-key hit is the same pins, installer, image and python by construction.
        if [ "${ENGINES_CACHED:-}" = "true" ]; then
          echo "Engines restored from cache ($TORANA_SCAN_PACK_DIR); not reinstalling."
        else
          # ⛔ Saved (next step) ONLY after a complete install: a partial pack cached under the exact key would be
          # restored, and its missing engines skipped, on every later run until the pins moved.
          if bash "$REF/install_engines.sh"; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::some engines unavailable; the scan will skip them and SAY SO (not cached)"
          fi
        fi
        # ⭐ The wheels are committed in this repo — no PyPI, no network package index.
        python3 -m pip install --quiet --upgrade pip
        python3 -m pip install --quiet "$WHEELS"/pantheon_shared-*.whl "$WHEELS"/torana_cli-*.whl
        torana --version || { echo "::error::torana CLI did not install"; exit 1; }

    - name: Save pinned engines
      if: ${{ steps.engines-install.outputs.complete == 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ~/.torana/scan-pack
        key: ${{ steps.engines-key.outputs.key }}

    - name: Scan
      id: scan
      shell: bash
      run: |
        set -euo pipefail
        OUT="${RUNNER_TEMP}/torana-scan"; mkdir -p "$OUT"
        SARIF="$OUT/torana.sarif"
        ARGS=(--repo . --scan-types "${{ inputs.scan-types }}" --out-dir "$OUT" --output "$SARIF")
        if [ "${{ steps.mode.outputs.scope }}" = "changed" ]; then
          BASE="${{ github.event.pull_request.base.sha }}"
          # ⚠️ A shallow clone has no base to diff. Degrade to a FULL scan rather than
          # silently scanning nothing — and say so, because a quiet empty diff reads as
          # "no findings".
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # ⭐ --emit-base-run appends what the SAME scan found at the base, tagged
            # delta_role=base, so Torana computes new/unchanged/fixed with the one
            # fingerprinter that mints the ids. Without it the gate cannot tell what
            # this PR INTRODUCED from what it inherited — and it passes rather than
            # blocking on the repository's whole backlog.
            ARGS+=(--base "$BASE" --emit-base-run)
            echo "base-scanned=true" >> "$GITHUB_OUTPUT"
          else
            # ⚠️ Says BOTH things it costs: no diff restriction AND no gate. A quiet
            # "scanning the full tree" reads like a bigger scan, not a disabled gate.
            #
            # ⛔ AND IT SAYS WHICH OF THE TWO CAUSES THIS IS. The old message assumed a
            # pull request and blamed a shallow clone — so on a push or a schedule it
            # told you to add `fetch-depth: 0` you may already have, and named a "PR"
            # that does not exist. Measured on the first real run of the reachability
            # workflow (pantheon-auth, push event, fetch-depth: 0 already set): the
            # advice sent the reader to check a setting that was already correct.
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "::warning::scope=changed was requested on a ${{ github.event_name }} event, which has no pull request to diff against — scanning the full tree. Nothing is gated (there is no PR to gate), and nothing is retired: the document still carries scan_scope=changed."
            else
              echo "::warning::base commit unavailable (shallow clone? add fetch-depth: 0) — scanning the full tree, and this PR will NOT be gated on new findings"
            fi
          fi
        fi
        python3 "$TORANA_SCAN_REF/scan_pack.py" "${ARGS[@]}"
        echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"

    - name: Authenticate to Torana
      id: auth
      if: ${{ inputs.push == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # ⛔ REQUESTED AFTER THE SCAN, NEVER BEFORE IT. The token lives 15 minutes and that
        # has to cover the INGEST, not the scan. A monorepo scan runs for tens of minutes,
        # so minting in a tidy prologue yields an expired token exactly when there is
        # finally something to push — and it fails only on the biggest repositories.
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::no OIDC token available — add 'permissions: { id-token: write }' to this job"; exit 1
        fi
        ASSERTION=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ inputs.audience }}" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
        BODY=$(python3 -c 'import json,sys; print(json.dumps({"oidc_token": sys.argv[1], "audience": sys.argv[2]}))' \
          "$ASSERTION" "${{ inputs.audience }}")
        RESP=$(curl -sS -w '\n%{http_code}' -X POST \
          "${{ inputs.torana-url }}/api/v1/ci/github/token" \
          -H 'content-type: application/json' -d "$BODY")
        CODE=$(echo "$RESP" | tail -1); JSON=$(echo "$RESP" | sed '$d')
        if [ "$CODE" != "200" ]; then
          # ⚠️ The platform's refusals are actionable, so they are surfaced verbatim:
          # 403 names the missing App installation, 401 the bad assertion.
          echo "::error::Torana refused the token exchange (HTTP $CODE): $(echo "$JSON" | head -c 400)"; exit 1
        fi
        echo "::add-mask::$(echo "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
        echo "TORANA_TOKEN=$(echo "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')" >> "$GITHUB_ENV"

    - name: Report to Torana
      if: ${{ inputs.push == 'true' }}
      shell: bash
      env:
        TORANA_BASE_URL: ${{ inputs.torana-url }}
      run: |
        set -euo pipefail
        # scan_scope travels with the document: closure only runs for 'full', and an
        # absent scope is read as 'changed' server-side, which closes nothing.
        # ⚠️ SARIF_FILE is POSITIONAL — there is no --file flag. Verified against
        # `torana ingest sarif --help`; an invented flag here fails only at the last
        # step of a real run, after the whole scan has been paid for.
        ARGS=(--scan-scope "${{ steps.mode.outputs.scope }}")
        # ⛔ --pr-number DIVERTS THE WRITE. With it the findings land in
        # pull_request_findings (branch state) and NOT in vulnerabilities, and the
        # response carries the gate verdict. Without it a PR scan would upsert the
        # SAME inventory rows a default-branch scan writes — so an abandoned branch
        # would leave permanently-open findings against code that never shipped.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          ARGS+=(--pr-number "${{ github.event.pull_request.number }}"
                 --head-sha "${{ github.event.pull_request.head.sha }}"
                 --base-sha "${{ github.event.pull_request.base.sha }}"
                 --head-ref "${{ github.event.pull_request.head.ref }}")
        fi
        torana ingest sarif "${{ steps.scan.outputs.sarif }}" "${ARGS[@]}"

    # ⛔ AFTER the ingest, and only on a push/schedule. A pull_request's findings go to
    # `pull_request_findings` (branch state) and NOT to `vulnerabilities`, so on a PR
    # there are no alerts to answer and the queue comes back empty — running it there
    # would spend minutes to do nothing and read like a broken step.
    - name: Answer this repository's reachability queue
      if: ${{ inputs.push == 'true' && inputs.reachability != 'false'
              && github.event_name != 'pull_request' }}
      shell: bash
      env:
        TORANA_BASE_URL: ${{ inputs.torana-url }}
      run: |
        set -euo pipefail
        # ⛔ A FRESH TOKEN, FOR THE SAME REASON THE INGEST MINTS ONE LATE. The CI token
        # lives 15 minutes and that budget has to cover THIS pass, which reads the tree
        # and posts one verdict per finding — minutes on a large repository. Reusing the
        # ingest's token means the writes start failing part-way through on exactly the
        # repositories that take longest, which is the worst place to discover it.
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::no OIDC token available — add 'permissions: { id-token: write }'"; exit 1
        fi
        ASSERTION=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ inputs.audience }}" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
        BODY=$(python3 -c 'import json,sys; print(json.dumps({"oidc_token": sys.argv[1], "audience": sys.argv[2]}))' \
          "$ASSERTION" "${{ inputs.audience }}")
        RESP=$(curl -sS -w '\n%{http_code}' -X POST \
          "${{ inputs.torana-url }}/api/v1/ci/github/token" \
          -H 'content-type: application/json' -d "$BODY")
        CODE=$(echo "$RESP" | tail -1); JSON=$(echo "$RESP" | sed '$d')
        if [ "$CODE" != "200" ]; then
          echo "::error::Torana refused the token exchange (HTTP $CODE): $(echo "$JSON" | head -c 400)"; exit 1
        fi
        TOKEN=$(echo "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
        echo "::add-mask::$TOKEN"
        export TORANA_TOKEN="$TOKEN"

        # ⚠️ The repository key comes from GITHUB_REPOSITORY, not from the git remote.
        # The platform refuses a verdict whose repository is not the one this token
        # PROVED, and GitHub signs that same value — so taking it from anywhere else
        # can only ever disagree with the server. Lowercased because the finding keys
        # are (`torana-inc`, not `Torana-Inc`).
        REPO_KEY="repo:github.com/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
        echo "Answering the reachability queue for $REPO_KEY at ${GITHUB_SHA:0:7}"

        # ⚠️ --apply writes. The pass is a dry run by default; without this it would
        # print a verdict for every finding and record none, which reads like success.
        # It exits non-zero if any write was REFUSED — a refusal means the server would
        # not attribute an answer to this repository, and a green gate over that is the
        # silent failure the refusal exists to prevent.
        python3 "$TORANA_SCAN_REF/reachability_pass.py" \
          --repo . --repo-key "$REPO_KEY" --apply

    - name: Upload to GitHub Security tab
      if: ${{ inputs.upload-github-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
