# Torana Remediate — propose deterministic dependency fixes, and (opt-in) have Torana open the approved ones as PRs.
#
# ⭐ PREFER THE REUSABLE WORKFLOW `.github/workflows/remediate.yml` (EM D-23 S3, README.md): it runs this Action as four
# jobs (`mode`), so install and tests never run next to the Torana token and the optional AI review runs with the
# customer's model key in a job holding no other credential. The single-job use below (no `mode`) is unchanged.
#
# Spec: pantheon-cli docs/remediation/FIX_PR_SPEC.md § 3.4.9 (this action), § 3.4.10 / § 3.4.11 (read tokens), § 3.7.
#
# ⭐ NO SECRET, AND NO GITHUB WRITE CREDENTIAL. The job proves which repository it is with a GitHub-issued OIDC
# assertion and exchanges it for a 15-minute Torana CI token bound to this repository (as actions/scan). It never
# pushes: the PLATFORM's GitHub App opens the PR, after checking every path and every changed line against what a
# human approved. A repository other than this one (e.g. the deploy repo whose lock builds this service) is read
# with a one-repository, contents:read token the platform mints, masked, used for one clone and revoked at once.
#
# The lane, per run:
#   1 propose  queue → remediation_plan.py → remediation_apply.py (scratch copy, gates 1–3) → `remediation-plans
#              propose`. Nothing reaches GitHub: a PERSON approves, changes or refuses each plan in Torana.
#   2 re-probe this repository's plans the platform marked "needs a fresh check".
#   3 open-pr  (`open-pr: true` only) each APPROVED plan → `remediation_apply.py --plan-id --open-pr`, which takes
#              the plan's lease, sends the files to Torana, and releases it. Torana opens the PR.
#
# Quickstart (commit as .github/workflows/torana-remediate.yml):
#
#   on:
#     schedule: [{ cron: '41 5 * * 1-5' }]
#     workflow_dispatch:
#   jobs:
#     remediate:
#       permissions: { id-token: write, contents: read }    # ⛔ no contents: write, no pull-requests: write
#       runs-on: ubuntu-latest
#       steps:
#         - uses: Torana-Inc/torana-skills/actions/remediate@v1
#           with:
#             torana-url: https://app.toranasecurity.ai
#             with: |                                       # trees whose locks build this repository
#               acme/deploy:base-image
#             open-pr: true
#
# ⛔ NEVER ON pull_request / pull_request_target. Refused at the first step.
# ⚠️ Use a NON-ROUND cron minute: ':00' in every repo fires an org at once.
# ⚠️ A `with` repository that is not this one must be DECLARED related by a tenant admin first
#    (`torana integration <IID> related-repos add`); undeclared ones are skipped with a warning.
#
# ⛔ The Action's own files are found through $GITHUB_ACTION_PATH (the env var), never the expression
# `${{ github.action_path }}`: in a job with `container:` the expression is the HOST path, absent inside the
# container; the runner translates only the env var (fixed 2026-11-03, as actions/scan in 258fb7c).

name: "Torana Remediate"
description: "Propose dependency fixes to Torana for human approval; Torana opens the approved PRs — no stored or write credential."
author: "Torana"

inputs:
  torana-url:
    description: "Your Torana platform base URL, e.g. https://app.toranasecurity.ai"
    required: true
  repo-key:
    description: >-
      This repository's Torana key. Default: repo:github.com/<owner>/<repo> from GITHUB_REPOSITORY, lowercased
      — the value GitHub signs and the platform binds the token to, so anything else is refused.
    required: false
    default: ""
  with:
    description: >-
      Newline list of other trees in scope, `owner/repo[:subdir]`: repositories whose manifests or locks build
      this one (e.g. `acme/deploy:base-image`). Read-only, through a platform-minted token.
    required: false
    default: ""
  open-pr:
    description: "'true' also hands every APPROVED plan of this repository to Torana to open its PR."
    required: false
    default: "false"
  audience:
    description: "OIDC audience to request. Must match the platform's expected audience."
    required: false
    default: "torana"
  mode:
    description: >-
      EM D-23 S3. Empty (default): the single-job lane, unchanged. resolve | gates | review | open-pr: one job of the
      reusable workflow `.github/workflows/remediate.yml`, which wires the four with the right permissions. ⛔ Use the
      workflow rather than calling these yourself: it is what keeps the model key and the Torana token apart.
    required: false
    default: ""
  review-max-plans:
    description: "mode resolve: at most this many plans get a review case per run (each review costs up to $0.50)."
    required: false
    default: "5"
  public:
    description: "'true' when this repository is public (the workflow passes github.event.repository.private)."
    required: false
    default: "false"
  cases-tar:
    description: "modes gates / review / open-pr: the downloaded cases.tar.gz."
    required: false
    default: ""
  gates-tar:
    description: "modes review / open-pr: the downloaded gates.tar.gz."
    required: false
    default: ""
  vets-tar:
    description: "mode open-pr: the downloaded vets.tar.gz (absent when review is off)."
    required: false
    default: ""
  anthropic-api-key:
    description: "mode review only: the customer's own model key. Reaches only the review step's environment."
    required: false
    default: ""

outputs:
  out-dir:
    description: "Where the queue, plan, probe and per-plan reports were written."
    value: ${{ steps.remediate.outputs.out-dir || steps.review.outputs.out-dir }}
  cases-tar:
    description: "mode resolve: the review cases to upload."
    value: ${{ steps.remediate.outputs.cases-tar }}
  gates-tar:
    description: "mode gates: the gate results to upload."
    value: ${{ steps.remediate.outputs.gates-tar }}
  vets-tar:
    description: "mode review: the reviews to upload."
    value: ${{ steps.review.outputs.vets-tar }}

runs:
  using: "composite"
  steps:
    - name: Refuse a pull request event
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        # ⛔ Before any checkout or install: a PR's code is not what ships, and pull_request_target would hand
        # an untrusted head this job's OIDC identity. (remediate.py refuses again, for a direct caller.)
        case "$EVENT" in
          pull_request*)
            echo "::error::actions/remediate never runs on '$EVENT'. Use schedule, push to the default branch, or workflow_dispatch."
            exit 1 ;;
        esac

    - name: Check out this repository (read-only)
      if: inputs.mode == '' || inputs.mode == 'resolve' || inputs.mode == 'open-pr'
      uses: actions/checkout@v4
      with:
        # EM D-23 S3: a fresh workspace each time (jobs 1 and 3 may run on a persistent self-hosted runner).
        clean: true
        # ⛔ Beside the other trees, because the planner labels a tree by its path relative to this checkout's
        # parent. persist-credentials: false keeps GITHUB_TOKEN out of .git/config.
        path: .torana-remediate/src/${{ github.event.repository.name }}
        persist-credentials: false
        fetch-depth: 1

    - name: Install the Torana CLI and the pinned resolver
      if: inputs.mode != 'review'
      shell: bash
      run: |
        set -euo pipefail
        # EM D-23 S3 (em3 build check m4): a persistent runner keeps the last run's scratch (target clones, cases,
        # reports). Start from nothing but this run's own checkout (src/).
        if [ -d "$GITHUB_WORKSPACE/.torana-remediate" ]; then
          find "$GITHUB_WORKSPACE/.torana-remediate" -mindepth 1 -maxdepth 1 ! -name src -exec rm -rf {} +
        fi
        REF="$GITHUB_ACTION_PATH/../../plugins/torana/skills/torana-scan/references"
        WHEELS="$GITHUB_ACTION_PATH/../../plugins/torana/skills/torana-skill/wheels"
        echo "TORANA_SCAN_REF=$REF" >> "$GITHUB_ENV"
        # ⭐ The wheels are committed in this repo — no PyPI, no network package index.
        python3 -m pip install --quiet --upgrade pip
        python3 -m pip install --quiet "$WHEELS"/pantheon_shared-*.whl "$WHEELS"/torana_cli-*.whl
        torana --version || { echo "::error::torana CLI did not install"; exit 1; }
        # The parsers for the planner's API diff check (FIX_KNOWLEDGE_CONVERGENCE § 3.6.6): into THIS python3,
        # the interpreter remediate.py runs the planner with (NOT the resolver venv below). Every wheel is
        # hash-pinned. ⚠️ Never a failed run: without them the API diff check falls back to name search, and the plan
        # says so (`method: word`, `method_why: parser_missing` / `javascript_parser_missing`).
        # ⛔ EACH FRONT END IS REPORTED SEPARATELY, and the IMPORT is what decides it, not the install. The call graph
        # has two front ends (reachability 1.14.0) and each grammar is a C extension built against one tree-sitter
        # ABI, so a wheel can install cleanly and still fail to load. A single "the parser is installed" line would
        # then claim call-graph precision for a half-parsed tree — exactly the over-report this step exists to avoid.
        python3 -m pip install --quiet --require-hashes -r "$GITHUB_ACTION_PATH/parser-requirements.txt" \
          || echo "::warning::the tree-sitter wheels could not be installed"
        if python3 -c 'import tree_sitter, tree_sitter_python' 2>/dev/null; then
          echo "API diff check, pypi: the Python parser loaded (method: call graph)"
        else
          echo "::warning::no Python tree-sitter parser: pypi API diff checks use name search (method: word, parser_missing), which over-reports"
        fi
        if python3 -c 'import tree_sitter, tree_sitter_javascript, tree_sitter_typescript' 2>/dev/null; then
          echo "API diff check, npm: the JS/TS parsers loaded (method: call graph)"
        else
          echo "::warning::no JS/TS tree-sitter parser: npm API diff checks use name search (method: word, javascript_parser_missing), which over-reports"
        fi
        # The resolver apply runs for pip-compile / uv locks (npm ships with the runner): PINNED, every wheel
        # hash-checked, in its own venv put first on PATH, so a runner's preinstalled uv never answers instead.
        UV_VENV="$RUNNER_TEMP/torana-uv"
        python3 -m venv "$UV_VENV"
        "$UV_VENV/bin/pip" install --quiet --require-hashes -r "$GITHUB_ACTION_PATH/uv-requirements.txt"
        echo "$UV_VENV/bin" >> "$GITHUB_PATH"
        "$UV_VENV/bin/uv" --version

    - name: Install the pinned reviewer (review only)
      if: inputs.mode == 'review'
      shell: bash
      env:
        CLAUDE_CODE_VERSION: "2.1.309"
        CLAUDE_CODE_INTEGRITY: "sha512-+lBYZRuXOJpiKJcRv/CK7gF+5UFNWyJE7hSxkgGUKDZOWgANl9MAabfTkrJk183Tp3B0Nv4xF/DU1t0BaKXOPw=="
      run: |
        set -euo pipefail
        # ⛔ No checkout, no CLI, no resolver here: nothing of the repository's own runs in the job that holds the key.
        # The reviewer is pinned to an exact release and its published integrity is checked before install.
        echo "TORANA_SCAN_REF=$GITHUB_ACTION_PATH/../../plugins/torana/skills/torana-scan/references" >> "$GITHUB_ENV"
        got="$(npm view "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" dist.integrity)"
        if [ "$got" != "$CLAUDE_CODE_INTEGRITY" ]; then
          echo "::error::@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION integrity differs from the pinned one"; exit 1
        fi
        npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
        claude --version

    - name: Review (the model key reaches this step only)
      id: review
      if: inputs.mode == 'review'
      shell: bash
      env:
        REMEDIATE_MODE: review
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        REMEDIATE_REPO_KEY: ${{ inputs.repo-key }}
        REMEDIATE_PUBLIC: ${{ inputs.public }}
        REMEDIATE_CASES_TAR: ${{ inputs.cases-tar }}
        REMEDIATE_GATES_TAR: ${{ inputs.gates-tar }}
        REMEDIATE_SUBJECT: ${{ github.workspace }}/.torana-remediate/src/${{ github.event.repository.name }}
        REMEDIATE_OUT: ${{ runner.temp }}/torana-review
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/remediate.py"

    - name: Remediate
      id: remediate
      if: inputs.mode != 'review'
      shell: bash
      env:
        REMEDIATE_MODE: ${{ inputs.mode }}
        REMEDIATE_REVIEW_MAX: ${{ inputs.review-max-plans }}
        REMEDIATE_PUBLIC: ${{ inputs.public }}
        REMEDIATE_CASES_TAR: ${{ inputs.cases-tar }}
        REMEDIATE_GATES_TAR: ${{ inputs.gates-tar }}
        REMEDIATE_VETS_TAR: ${{ inputs.vets-tar }}
        TORANA_BASE_URL: ${{ inputs.torana-url }}
        TORANA_OIDC_AUDIENCE: ${{ inputs.audience }}
        REMEDIATE_REPO_KEY: ${{ inputs.repo-key }}
        REMEDIATE_WITH: ${{ inputs.with }}
        REMEDIATE_OPEN_PR: ${{ inputs.open-pr }}
        REMEDIATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REMEDIATE_SUBJECT: ${{ github.workspace }}/.torana-remediate/src/${{ github.event.repository.name }}
        REMEDIATE_OUT: ${{ github.workspace }}/.torana-remediate
      run: |
        set -euo pipefail
        # ⛔ Every token is minted INSIDE this step, right before the call that needs it (the CI token lives
        # 900 s, a resolve can outlast it), and apply re-mints through TORANA_TOKEN_CMD before each of its writes.
        python3 "$GITHUB_ACTION_PATH/remediate.py"
